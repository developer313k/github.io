<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jawad Ahmad Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout: sticky nav, hero band with photo + art, then a 2x2 grid of glowing panels (skills, projects, experience, contact). Single dark navy look. */
:root{
  --bg:#050b1f; --bg2:#081433; --panel:#0a1a46; --line:#1f3f93; --accent:#1f6bff; --cyan:#27b9ff; --fg:#f3f7ff; --muted:#9fb2dc; --good:#2ecc71;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:radial-gradient(1100px 500px at 78% 8%,#12307a55,transparent 60%),radial-gradient(900px 500px at 10% 95%,#0e2a7040,transparent 60%),var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#050b1fe8;backdrop-filter:blur(8px);border-bottom:1px solid #1a2f6b66;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;white-space:nowrap}
.logo em{font-style:normal;color:var(--cyan)}
nav{flex:1;min-width:0;display:flex;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;color:#dfe8ff;font-size:12.5px;font-weight:500;white-space:nowrap}
nav a svg{width:15px;height:15px;opacity:.9}
nav a.on,nav a:hover{background:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 20px;font-weight:600;font-size:13px;color:#fff;background:var(--accent);box-shadow:0 6px 22px #1f6bff55;white-space:nowrap}
.btn:hover{background:#3b7fff}
.btn.ghost{background:#0b1a44;border:1px solid #cfd9ff88;box-shadow:none}
.btn.ghost:hover{background:#12265f}
.ico-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#fff}
.ico-btn svg{width:22px;height:22px}

/* hero */
.hero{margin-top:22px;border:1px solid #2a56c577;border-radius:18px;background:linear-gradient(120deg,#07122f,#0a1d52 55%,#0b2a73);box-shadow:0 0 40px #1f6bff22 inset,0 10px 40px #00000055;overflow:hidden;position:relative}
.hero-in{display:grid;grid-template-columns:auto 1px minmax(0,1.05fr) minmax(0,1fr);gap:30px;align-items:center;padding:34px 34px 30px}
.me{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:150px;height:150px;border-radius:50%;padding:5px;background:linear-gradient(135deg,#2c7bff,#9a4dff);box-shadow:0 0 30px #2c7bffaa}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 25%;display:block;border:3px solid #07122f}
.pencil{position:absolute;right:-2px;bottom:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:none;place-items:center;box-shadow:0 4px 14px #0008}
.editing .pencil{display:grid}
.pencil svg{width:16px;height:16px}
.avail{display:flex;align-items:center;gap:7px;font-size:11px;padding:5px 12px;border-radius:999px;border:1px solid #2a56c5aa;background:#081433;color:#dfe8ff}
.avail i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.vr{align-self:stretch;background:#3a5fb866;min-height:160px}
.hero h1{margin:0;font-size:clamp(28px,3.6vw,40px);line-height:1.15;font-weight:700}
.hero h1 b{color:var(--cyan);font-weight:700}
.roles{margin:10px 0 8px;font-weight:600;font-size:16px}
.intro{margin:0 0 20px;color:#c8d6f5;max-width:46ch;font-size:13.5px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.soc{display:flex;gap:12px}
.soc a{width:24px;height:24px;display:grid;place-items:center;color:#fff}
.soc svg{width:22px;height:22px}
.art{position:relative;min-height:290px}
.art .big{position:absolute;left:4%;top:0;margin:0;font-style:italic;font-weight:800;font-size:clamp(36px,4.2vw,52px);line-height:1;letter-spacing:-1px;background:linear-gradient(90deg,#cfe0ff,#4d8dff);-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-6deg);transform-origin:left top}
.art .big span{display:block;color:transparent;background:linear-gradient(90deg,#27b9ff,#1f6bff);-webkit-background-clip:text;background-clip:text;padding-left:30px;font-size:1.15em}
.art svg{position:absolute;right:-6px;bottom:-16px;width:100%;max-width:430px;height:auto}

/* panels */
.grid{display:grid;grid-template-columns:5fr 7fr;gap:18px;margin-top:18px}
.panel{border:1px solid #2a56c577;border-radius:16px;background:linear-gradient(160deg,#08163d,#0a1c4d);padding:18px 20px;box-shadow:0 0 26px #1f6bff1c inset,0 8px 30px #00000040;min-width:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph svg.pi{width:26px;height:26px;color:var(--accent);flex:none}
.ph h2{margin:0;font-size:17px;font-weight:600;flex:1}
.add{display:none;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:12px;padding:8px 14px;box-shadow:0 4px 14px #1f6bff55;white-space:nowrap}
.editing .add{display:inline-flex}

.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.skill{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:10px;background:#0c1f56;border:1px solid #2a4aa466;font-size:11.5px;text-align:center;min-width:0}
.skill .ico{width:32px;height:32px;display:block}
.skill .ico svg{width:32px;height:32px;display:block}
.skill [data-e]{max-width:100%;overflow-wrap:anywhere}

.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.proj{position:relative;border-radius:12px;overflow:hidden;background:#0c1f56;border:1px solid #2a4aa466;display:flex;flex-direction:column;min-width:0}
.proj .thumb{position:relative;aspect-ratio:16/9;background:#0a1740;overflow:hidden}
.proj .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.proj .thumb button{position:absolute;inset:0;border:0;background:#050b1fb0;color:#fff;font-weight:600;font-size:12px;display:none;place-items:center}
.editing .proj .thumb button{display:grid}
.proj .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.proj h3{margin:0;font-size:13px;font-weight:600}
.proj .tools{font-size:10.5px;color:var(--muted)}
.proj .vp{margin-top:6px;font-size:11.5px;font-weight:600;color:var(--cyan);display:inline-flex;align-items:center;gap:5px;align-self:flex-start}

.x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:0;background:#e5484d;color:#fff;font-size:14px;line-height:1;display:none;place-items:center;z-index:2}
.editing .x{display:grid}

.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 16px 28px}
.tl li::before{content:"";position:absolute;left:3px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tl li::after{content:"";position:absolute;left:8px;top:18px;bottom:-4px;width:1px;background:#2f58c4}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl .t{font-weight:600;font-size:13.5px;padding-right:26px}
.tl .s{font-size:11.5px;color:var(--muted)}
.tl .s.hl{color:var(--cyan);font-weight:600}
.tl .x{top:0}

.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.contact p.lead{margin:0 0 14px;color:#c8d6f5;font-size:13px}
.crow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.crow svg{width:20px;height:20px;color:var(--accent);flex:none}
.contact .soc{margin-top:16px}
.contact .soc a{width:28px;height:28px}
form{display:flex;flex-direction:column;gap:9px;min-width:0}
input,textarea{width:100%;font-family:inherit;font-size:13px;color:var(--fg);background:#0e2160;border:1px solid #2a4aa4aa;border-radius:9px;padding:10px 12px}
input::placeholder,textarea::placeholder{color:#8fa3d4}
textarea{min-height:84px;resize:vertical}
.fmsg{font-size:12px;color:var(--muted);min-height:18px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding:16px 4px 0;color:#cdd9f7;font-size:12px}
.foot a{display:inline-flex;align-items:center;gap:6px}

/* editing */
[contenteditable="true"]{outline:1px dashed #27b9ffaa;outline-offset:2px;border-radius:4px;cursor:text}
[contenteditable="true"]:focus{outline:2px solid var(--cyan);background:#ffffff10}
.editbar{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.admin .editbar{display:flex}
.editonly{display:none}
.editing .editonly{display:inline-flex}
[hidden]{display:none!important}
.editbar .hint{display:none;background:#081433;border:1px solid #2a56c5;border-radius:999px;padding:8px 14px;font-size:12px;color:#dfe8ff}
.editing .editbar .hint{display:block}
.editbar .btn{padding:12px 20px}
.btn.danger{display:none;background:#0b1a44;border:1px solid #e5484d99;color:#ffb4b6;box-shadow:none}
.editing .btn.danger{display:inline-flex}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#101f4f;border:1px solid #2a56c5;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;z-index:70;background:#02061aaa;display:grid;place-items:center;padding:16px}
.modal .box{width:min(420px,100%);background:#0a1a46;border:1px solid #2a56c5;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000a}
.modal h3{margin:0;font-size:16px}
.modal label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
.modal small{color:var(--muted);font-size:11.5px}

@media (max-width:1000px){
  .hero-in{grid-template-columns:auto 1px minmax(0,1fr)}
  .art{display:none}
  .grid{grid-template-columns:1fr}
  .top .wrap{flex-wrap:wrap}
  nav{order:3;flex-basis:100%;justify-content:flex-start}
  .top .wrap .spacer{flex:1}
}
@media (max-width:640px){
  .hero-in{grid-template-columns:1fr;padding:24px 18px;gap:18px;justify-items:start}
  .vr{display:none}
  .me{flex-direction:row;align-items:center;gap:16px}
  .ring{width:96px;height:96px}
  .skills{grid-template-columns:repeat(3,minmax(0,1fr))}
  .projects{grid-template-columns:1fr}
  .contact{grid-template-columns:1fr}
  .logo{font-size:17px}
  .btn.dl{padding:9px 14px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

    var y=window.scrollY+120,cur='home';
    ['home','skills','projects','experience','contact'].forEach(function(id){var n=document.getElementById(id);if(n&&n.getBoundingClientRect().top+window.scrollY<=y)cur=id});
    if(window.innerHeight+window.scrollY>=document.body.scrollHeight-4)cur='contact';
    links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+cur)});
  }
  window.addEventListener('scroll',onScroll,{passive:true});

  derived();renderSkills();renderProjects();renderExp();onScroll();
})();
</script>

</html>
